name: Tests
on:
  push:
    branches: [main]
jobs:
  compile-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: make
      - uses: ./conversor c2f 100
  compile-test-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: make
      - uses: ./conversor

